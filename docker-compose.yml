services:
  db:
    image: postgres:16
    container_name: study-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: study_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_user -d study_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
